<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login successful</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="card">
  <h1 class="ok">Login successful</h1>
  <p>Welcome, <strong id="user"></strong>. Your login name and password matched the database.</p>
  <button type="button" id="logout">Logout</button>
</div>
<script>
  const user = sessionStorage.getItem("user");
  if (!user) { window.location.href = "index.html"; }
  document.getElementById("user").textContent = user;   // textContent keeps the name safe from HTML injection
  document.getElementById("logout").addEventListener("click", () => {
    sessionStorage.removeItem("user");
    window.location.href = "index.html";
  });
</script>
</body></html>
